<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chatting with Claude</title>
  <meta name="description" content="A chat with Claude where every frame is drawn by code. Tap to replay.">
  <meta name="theme-color" content="#f4f1ea">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <style>
    @font-face { font-family: "Cabin Sketch"; font-weight: 700; src: url("../fonts/cabin-sketch-latin-700-normal.woff2") format("woff2"); }
    @font-face { font-family: "Patrick Hand"; src: url("../fonts/patrick-hand-latin-400-normal.woff2") format("woff2"); }
    :root {
      --ink: #1f1f24; --ink-soft: #6a6b74; --paper: #f4f1ea; --paper-2: #fbfaf6;
      --accent: #d97757; --sign: #ffd60a; --tape: rgba(120, 170, 255, .55);
      --hand: "Patrick Hand", "Comic Sans MS", cursive; --sketch: "Cabin Sketch", "Patrick Hand", cursive;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { background: #e9e4d8; display: grid; place-items: center; cursor: pointer; }
    body.render { background: var(--paper); cursor: default; }

    /* The stage is always 1080x1920 (a vertical reel) and gets scaled to fit the window. */
    #stage {
      position: absolute; left: 50%; top: 50%; width: 1080px; height: 1920px; overflow: hidden;
      transform-origin: 0 0; color: var(--ink); font: 52px/1.32 var(--hand); background: var(--paper);
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .28  0 0 0 0 .25  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }
    body.render #stage { left: 0; top: 0; transform: none !important; }

    .hook {
      position: absolute; left: 70px; right: 70px; top: 120px; padding: 26px 34px 30px; text-align: center;
      background: var(--sign); border: 4px solid var(--ink); border-radius: 18px 26px 16px 30px;
      font: 700 64px/1.12 var(--sketch); transform: rotate(-1.6deg); box-shadow: 8px 10px 0 rgba(31, 31, 36, .9);
    }
    .hook::before {
      content: ""; position: absolute; top: -26px; left: 50%; width: 190px; height: 46px; margin-left: -95px;
      background: var(--tape); transform: rotate(3deg);
    }

    .head { position: absolute; left: 70px; right: 70px; top: 400px; display: flex; align-items: center; gap: 24px; }
    .head .name { font: 700 58px/1 var(--sketch); }
    .head .status { font-size: 38px; color: var(--ink-soft); }
    .avatar {
      flex: none; width: 104px; height: 104px; display: grid; place-items: center;
      background: var(--paper-2); border: 4px solid var(--ink); border-radius: 50% 46% 52% 48%;
    }
    .avatar svg { width: 64px; height: 64px; }
    .rule { position: absolute; left: 60px; right: 60px; top: 538px; height: 14px; }

    #chat { position: absolute; left: 0; right: 0; top: 566px; bottom: 270px; overflow: hidden; }
    #list { position: absolute; left: 0; right: 0; top: 0; padding: 30px 70px 10px; }
    .slot { overflow: visible; }
    .msg {
      position: relative; max-width: 820px; padding: 22px 34px 26px; margin-bottom: 38px; border: 4px solid var(--ink);
      white-space: pre-wrap; overflow-wrap: break-word;
    }
    .msg.user { margin-left: auto; background: var(--sign); border-radius: 30px 22px 6px 34px; box-shadow: 6px 8px 0 var(--ink); }
    .msg.claude { margin-right: auto; background: var(--paper-2); border-radius: 22px 32px 30px 6px; box-shadow: 6px 8px 0 var(--accent); }
    .msg .who { display: block; font: 700 34px/1.2 var(--sketch); color: var(--accent); margin-bottom: 6px; }
    .msg code {
      font: 600 44px/1 ui-monospace, "DejaVu Sans Mono", monospace; padding: 2px 12px; border-radius: 10px;
      background: #f1e3d6; border: 2px solid rgba(31, 31, 36, .25);
    }
    .dots { display: inline-flex; gap: 14px; padding: 18px 4px 6px; }
    .dots i { width: 20px; height: 20px; border-radius: 50%; background: var(--accent); }

    .bar {
      position: absolute; left: 60px; right: 60px; bottom: 96px; min-height: 130px; display: flex; align-items: center; gap: 20px;
      padding: 18px 22px 18px 40px; background: var(--paper-2); border: 4px solid var(--ink); border-radius: 34px 28px 36px 26px;
    }
    #typed { flex: 1; font-size: 48px; line-height: 1.25; white-space: pre-wrap; overflow-wrap: break-word; }
    #typed.empty { color: var(--ink-soft); }
    .caret { display: inline-block; width: 4px; height: 52px; margin-left: 3px; vertical-align: -10px; background: var(--ink); }
    #send {
      flex: none; width: 92px; height: 92px; border-radius: 50%; border: 4px solid var(--ink); display: grid; place-items: center;
      background: var(--accent); color: var(--paper-2);
    }
    #send svg { width: 46px; height: 46px; }

    #end {
      position: absolute; inset: 0; display: grid; place-content: center; gap: 40px; text-align: center; padding: 0 90px;
      background: rgba(244, 241, 234, .96); opacity: 0;
    }
    #end .big { font: 700 108px/1.05 var(--sketch); }
    #end .big b { color: var(--accent); }
    #end .small { font-size: 56px; color: var(--ink-soft); }
    #end .url {
      justify-self: center; padding: 14px 40px 18px; font: 700 64px/1 var(--sketch); background: var(--sign);
      border: 4px solid var(--ink); border-radius: 20px 30px 18px 28px; box-shadow: 8px 10px 0 var(--ink);
    }
    .hint { position: fixed; bottom: 10px; left: 0; right: 0; text-align: center; font: 18px var(--hand); color: var(--ink-soft); }
    body.render .hint { display: none; }
  </style>
</head>
<body>
  <div id="stage">
    <div class="hook">POV: you ask Claude to make you a viral video</div>

    <div class="head">
      <div class="avatar" aria-hidden="true">
        <svg viewBox="-50 -50 100 100"><g stroke="#d97757" stroke-width="13" stroke-linecap="round">
          <path d="M0-40V40M-40 0H40M-28-28 28 28M-28 28 28-28"/></g></svg>
      </div>
      <div>
        <div class="name">Claude</div>
        <div class="status" id="status">online</div>
      </div>
    </div>
    <svg class="rule" viewBox="0 0 960 14" preserveAspectRatio="none" aria-hidden="true">
      <path d="M2 8 C 160 2, 320 12, 480 6 S 800 3, 958 9" fill="none" stroke="#1f1f24" stroke-width="4" stroke-linecap="round"/>
    </svg>

    <div id="chat"><div id="list"></div></div>

    <div class="bar">
      <div id="typed"></div>
      <div id="send" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </div>
    </div>

    <div id="end">
      <div class="big">This whole video<br>is <b>code</b>.</div>
      <div class="small">No camera. No editing app.<br>HTML + a script + ffmpeg.</div>
      <div class="url">tanmaysarkar.dev</div>
    </div>
  </div>
  <p class="hint">tap anywhere to replay</p>

  <script>
    // ---- The whole conversation. Edit these lines and re-render to get a new video. ----
    const SCRIPT = [
      { from: "user",   text: "claude, everyone's posting videos of them chatting with you. can you make one for me?" },
      { from: "claude", text: "Already done. You're watching it." },
      { from: "user",   text: "wait. this video is made of code??" },
      { from: "claude", text: "Every frame. An HTML page draws this chat, a script screenshots it 30 times a second, and `ffmpeg` stitches the frames into an MP4. Even the typing sounds are generated." },
      { from: "user",   text: "no camera? no editing app?" },
      { from: "claude", text: "None. Change the lines in one array, run `node render.js`, and you get a brand new video." },
      { from: "user",   text: "ok last thing. make it go viral" },
      { from: "claude", text: "I wrote the code. Going viral is your part. Hit share." },
    ];

    const CHARS_PER_SEC = 16;   // how fast "you" type
    const WORDS_PER_SEC = 6.5;  // how fast Claude streams
    const THINK = 1.1;          // typing-dots time before Claude answers
    const END_CARD = 4;         // seconds the end card stays up

    // Small deterministic noise so typing rhythm looks human but renders identically every time.
    const jitter = i => { const x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };

    // ---- Timeline: turn the script into timestamps (also used by render.js for sound effects). ----
    function buildTimeline() {
      let t = 1.2, key = 0;
      const msgs = SCRIPT.map(m => {
        const e = { ...m };
        if (m.from === "user") {
          e.typeStart = t; e.keys = [];
          for (let i = 0; i < m.text.length; i++) {
            e.keys.push(t);
            t += (0.55 + 0.9 * jitter(key++)) / CHARS_PER_SEC + (m.text[i] === " " ? 0.03 : 0);
          }
          e.appear = t + 0.35;
          t = e.appear + 0.7;
        } else {
          e.words = m.text.split(" ");
          e.appear = t;
          e.streamStart = t + THINK;
          e.streamEnd = e.streamStart + e.words.length / WORDS_PER_SEC;
          t = e.streamEnd + Math.max(1.3, e.words.length * 0.09);
        }
        return e;
      });
      const endAt = t;
      return { msgs, endAt, duration: endAt + END_CARD };
    }
    const TL = buildTimeline();
    window.TIMELINE = {
      duration: TL.duration,
      keys: TL.msgs.flatMap(m => m.keys || []),
      sends: TL.msgs.filter(m => m.from === "user").map(m => m.appear),
      replies: TL.msgs.filter(m => m.from === "claude").map(m => m.streamStart),
      end: TL.endAt,
    };

    // ---- Drawing. render(t) is pure: the same t always gives the same frame. ----
    const $ = id => document.getElementById(id);
    const list = $("list"), chat = $("chat"), typed = $("typed"), status = $("status"), end = $("end"), send = $("send");
    const clamp = x => Math.max(0, Math.min(1, x));
    const easeOut = x => 1 - Math.pow(1 - x, 3);
    const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
    const codeify = s => {
      let h = esc(s);
      if ((h.match(/`/g) || []).length % 2) h = h.replace(/`([^`]*)$/, "$1");  // half-streamed code span
      return h.replace(/`([^`]+)`/g, "<code>$1</code>");
    };

    const slots = TL.msgs.map(m => {
      const slot = document.createElement("div");
      slot.className = "slot";
      slot.innerHTML = `<div class="msg ${m.from}"></div>`;
      list.appendChild(slot);
      return { slot, box: slot.firstChild, html: null };
    });

    function setHTML(s, html) { if (s.html !== html) { s.box.innerHTML = html; s.html = html; } }

    function render(t) {
      TL.msgs.forEach((m, i) => {
        const s = slots[i];
        if (t < m.appear) { s.slot.style.display = "none"; return; }
        s.slot.style.display = "block";
        if (m.from === "claude") {
          if (t < m.streamStart) {
            const dots = [0, 1, 2].map(k => `<i style="transform:translateY(${(-14 * Math.max(0, Math.sin(t * 9 - k * 0.9))).toFixed(1)}px)"></i>`).join("");
            setHTML(s, `<span class="who">Claude</span><span class="dots">${dots}</span>`);
          } else {
            const n = Math.min(m.words.length, Math.floor((t - m.streamStart) * WORDS_PER_SEC) + 1);
            setHTML(s, `<span class="who">Claude</span>${codeify(m.words.slice(0, n).join(" "))}`);
          }
        } else {
          setHTML(s, esc(m.text));
        }
        // Pop-in: height grows, bubble slides up and fades in.
        const p = easeOut(clamp((t - m.appear) / 0.32));
        s.slot.style.height = "auto";
        const h = s.slot.offsetHeight;
        s.slot.style.height = (h * p).toFixed(1) + "px";
        s.box.style.opacity = p.toFixed(3);
        s.box.style.transform = `translateY(${((1 - p) * 40).toFixed(1)}px) scale(${(0.94 + 0.06 * p).toFixed(3)})`;
      });

      // Keep the newest message in view.
      list.style.transform = `translateY(${Math.min(0, chat.clientHeight - list.offsetHeight).toFixed(1)}px)`;

      // Input bar: show the message currently being typed.
      const typing = TL.msgs.find(m => m.from === "user" && t >= m.typeStart && t < m.appear);
      const thinking = TL.msgs.find(m => m.from === "claude" && t >= m.appear && t < m.streamEnd);
      if (typing) {
        const n = typing.keys.filter(k => k <= t).length;
        const caretOn = n < typing.text.length || Math.floor(t * 2.2) % 2 === 0;
        typed.className = "";
        typed.innerHTML = esc(typing.text.slice(0, n)) + (caretOn ? '<span class="caret"></span>' : "");
      } else {
        typed.className = "empty";
        typed.textContent = "Reply to Claude...";
      }
      send.style.opacity = typing ? 1 : 0.35;
      status.textContent = thinking ? (t < thinking.streamStart ? "thinking..." : "typing...") : "online";

      const e = easeOut(clamp((t - TL.endAt) / 0.6));
      end.style.opacity = e.toFixed(3);
      end.style.transform = `scale(${(1.04 - 0.04 * e).toFixed(3)})`;
    }
    window.render = render;

    // ---- Live playback in the browser (render.js uses ?render instead). ----
    const stage = $("stage");
    if (new URLSearchParams(location.search).has("render")) {
      document.body.classList.add("render");
      render(0);
    } else {
      const fit = () => {
        const k = Math.min(innerWidth / 1080, innerHeight / 1920);
        stage.style.transform = `scale(${k}) translate(-540px, -960px)`;
      };
      addEventListener("resize", fit); fit();
      let start = performance.now();
      addEventListener("click", () => { start = performance.now(); });
      const loop = now => {
        const t = (now - start) / 1000;
        render(Math.min(t, TL.duration));
        requestAnimationFrame(loop);
      };
      document.fonts.ready.then(() => requestAnimationFrame(loop));
    }
  </script>
</body>
</html>
